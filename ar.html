<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>No051 — AR Viewer</title>
<link rel="apple-touch-icon" href="No051_512.png">
<link rel="icon" type="image/png" href="No051_512.png">
<script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #000; }

.hud-corner {
  position: fixed;
  width: 44px; height: 44px;
  border-color: rgba(0,229,255,0.3);
  border-style: solid;
  z-index: 100;
  pointer-events: none;
}
.hud-corner.tl { top:16px; left:16px;   border-width: 2px 0 0 2px; }
.hud-corner.tr { top:16px; right:16px;  border-width: 2px 2px 0 0; }
.hud-corner.bl { bottom:16px; left:16px;  border-width: 0 0 2px 2px; }
.hud-corner.br { bottom:16px; right:16px; border-width: 0 2px 2px 0; }

#scan-hint {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  z-index: 100;
  pointer-events: none;
  transition: opacity 0.6s ease;
  font-family: monospace;
}
.hint-frame {
  position: relative;
  width: 180px; height: 180px;
  border: 1px solid rgba(0,229,255,0.25);
  animation: framePulse 2s ease-in-out infinite;
}
@keyframes framePulse {
  0%,100% { border-color: rgba(0,229,255,0.25); }
  50%     { border-color: rgba(0,229,255,0.6); box-shadow: 0 0 20px rgba(0,229,255,0.15); }
}
.hint-frame::before { content:''; position:absolute; top:-1px; left:-1px; width:20px; height:20px; border:2px solid rgba(0,229,255,0.7); border-right:none; border-bottom:none; }
.hint-frame::after  { content:''; position:absolute; bottom:-1px; right:-1px; width:20px; height:20px; border:2px solid rgba(0,229,255,0.7); border-left:none; border-top:none; }
.hint-frame .c-tr { position:absolute; top:-1px; right:-1px; width:20px; height:20px; border:2px solid rgba(0,229,255,0.7); border-left:none; border-bottom:none; }
.hint-frame .c-bl { position:absolute; bottom:-1px; left:-1px; width:20px; height:20px; border:2px solid rgba(0,229,255,0.7); border-right:none; border-top:none; }
.hint-scan {
  position: absolute;
  left: 0; width: 100%; height: 1px;
  background: linear-gradient(to right, transparent, rgba(0,229,255,0.7), transparent);
  animation: scanMove 2s linear infinite;
}
@keyframes scanMove {
  0%   { top:0%;   opacity:0; }
  8%   { opacity:1; }
  92%  { opacity:1; }
  100% { top:100%; opacity:0; }
}
.hint-text {
  color: rgba(0,229,255,0.55);
  font-size: 0.62em;
  letter-spacing: 0.25em;
  text-align: center;
  animation: textBlink 2s ease-in-out infinite;
}
@keyframes textBlink {
  0%,100% { opacity:0.55; }
  50%     { opacity:0.2; }
}
#status-bar {
  position: fixed;
  bottom: 18px; left: 0; right: 0;
  text-align: center;
  font-size: 0.5em;
  letter-spacing: 0.25em;
  color: rgba(0,229,255,0.25);
  z-index: 100;
  pointer-events: none;
  font-family: monospace;
}
</style>

<!-- Canvas テクスチャでテキストを描画するカスタムコンポーネント -->
<script>
AFRAME.registerComponent('canvas-message', {
  schema: { value: { type: 'string', default: '' } },

  init: function () {
    var msg = this.data.value;

    // ── Canvas にテキストを描画
    var canvas  = document.createElement('canvas');
    canvas.width  = 1024;
    canvas.height = 512;
    var ctx = canvas.getContext('2d');

    // 背景
    ctx.fillStyle = 'rgba(0, 24, 40, 0.92)';
    ctx.fillRect(0, 0, 1024, 512);

    // 上下ボーダーライン
    ctx.strokeStyle = 'rgba(0, 229, 255, 0.85)';
    ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(0, 3);   ctx.lineTo(1024, 3);   ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, 509); ctx.lineTo(1024, 509); ctx.stroke();

    // 左右ボーダーライン（薄め）
    ctx.strokeStyle = 'rgba(0, 229, 255, 0.3)';
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(2, 0);    ctx.lineTo(2, 512);    ctx.stroke();
    ctx.beginPath(); ctx.moveTo(1022, 0); ctx.lineTo(1022, 512); ctx.stroke();

    // ヘッダーラベル
    ctx.fillStyle  = 'rgba(0, 229, 255, 0.35)';
    ctx.font       = '28px monospace';
    ctx.textAlign  = 'center';
    ctx.fillText('MSG.RECV', 512, 60);

    // メッセージ本文（グロー）
    ctx.shadowColor   = 'rgba(0, 229, 255, 0.8)';
    ctx.shadowBlur    = 24;
    ctx.fillStyle     = '#00e5ff';
    ctx.font          = 'bold 72px monospace';
    ctx.textAlign     = 'center';

    // 長いテキストは折り返す
    var words    = msg.split('');
    var lines    = [];
    var line     = '';
    var maxChars = 14;
    for (var i = 0; i < words.length; i++) {
      line += words[i];
      if (line.length >= maxChars || i === words.length - 1) {
        lines.push(line);
        line = '';
      }
    }
    var totalH  = lines.length * 90;
    var startY  = (512 - totalH) / 2 + 72;
    lines.forEach(function(l, idx) {
      ctx.fillText(l, 512, startY + idx * 90);
    });

    ctx.shadowBlur = 0;

    // フッター装飾バー
    ctx.fillStyle = 'rgba(0, 229, 255, 0.45)';
    ctx.fillRect(180, 465, 280, 5);
    ctx.fillStyle = 'rgba(0, 229, 255, 0.25)';
    ctx.fillRect(500, 465, 140, 5);

    // ── Three.js テクスチャとして板に適用
    var texture  = new THREE.CanvasTexture(canvas);
    var geometry = new THREE.PlaneGeometry(2.5, 1.25);
    var material = new THREE.MeshBasicMaterial({
      map:         texture,
      transparent: true,
      side:        THREE.DoubleSide
    });
    var mesh = new THREE.Mesh(geometry, material);
    this.el.setObject3D('msg-panel', mesh);
  }
});
</script>

</head>
<body>

<div class="hud-corner tl"></div>
<div class="hud-corner tr"></div>
<div class="hud-corner bl"></div>
<div class="hud-corner br"></div>

<div id="scan-hint">
  <div class="hint-frame">
    <div class="c-tr"></div>
    <div class="c-bl"></div>
    <div class="hint-scan"></div>
  </div>
  <div class="hint-text">MARKER を探しています</div>
</div>

<div id="status-bar">AR SCANNING — MINIMUM REQUIREMENTS</div>

<a-scene
  vr-mode-ui="enabled: false"
  renderer="logarithmicDepthBuffer: true; precision: medium;"
  embedded
  arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
>
  <a-marker
    preset="hiro"
    id="hiro-marker"
    emitevents="true"
  >
    <a-entity
      id="holo-root"
      position="0 0.01 0"
      rotation="-90 0 0"
      animation__float="property: position;
                         from: 0 0.01 0;
                         to:   0 0.08 0;
                         dir: alternate;
                         dur: 2500;
                         loop: true;
                         easing: easeInOutSine"
    >
      <!-- canvas-message コンポーネントがCanvasでテキストを描画しテクスチャとして貼る -->
      <a-entity id="msg-entity"></a-entity>
    </a-entity>
  </a-marker>

  <a-entity camera></a-entity>
</a-scene>

<script>
// URLパラメータ取得
var msg = new URLSearchParams(location.search).get('text') || 'NO MESSAGE';

// scene loaded 後にコンポーネントをセット
document.querySelector('a-scene').addEventListener('loaded', function() {
  document.getElementById('msg-entity').setAttribute('canvas-message', 'value', msg);
});

// マーカーイベント
var marker    = document.getElementById('hiro-marker');
var scanHint  = document.getElementById('scan-hint');
var statusBar = document.getElementById('status-bar');

marker.addEventListener('markerFound', function() {
  scanHint.style.opacity = '0';
  statusBar.textContent  = 'HOLOGRAM PROJECTION ACTIVE';
});
marker.addEventListener('markerLost', function() {
  scanHint.style.opacity = '1';
  statusBar.textContent  = 'AR SCANNING — MINIMUM REQUIREMENTS';
});
</script>
</body>
</html>
