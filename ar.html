<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">

<script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>

<style>
body {
  margin: 0;
  overflow: hidden;
  background: black;
}
</style>
</head>

<body>

<a-scene embedded vr-mode-ui="enabled: false">

  <!-- カメラ -->
  <a-entity camera look-controls position="0 1.6 0"></a-entity>

  <!-- ホログラム -->
  <a-entity id="holo" position="0 1.6 -2">

    <!-- パネル -->
    <a-plane 
      width="1.6"
      height="0.6"
      color="#001a1a"
      opacity="0.4">
    </a-plane>

    <!-- テキスト -->
    <a-text 
      id="msg"
      value="..."
      align="center"
      color="#00ffff"
      width="2"
      position="0 0 0.01"
      opacity="0.9"
      animation="property: position; dir: alternate; dur: 1200; loop: true; to: 0 0.05 0.01">
    </a-text>

  </a-entity>

</a-scene>

<script>
// URLからテキスト取得
const params = new URLSearchParams(location.search);
const text = params.get("text") || "NO MESSAGE";

document.getElementById("msg").setAttribute("value", text);

// ★ スマホカメラ起動（重要）
navigator.mediaDevices.getUserMedia({ video: true })
.then(stream => {
  const video = document.createElement("video");
  video.srcObject = stream;
  video.play();

  video.style.position = "fixed";
  video.style.top = 0;
  video.style.left = 0;
  video.style.width = "100%";
  video.style.height = "100%";
  video.style.objectFit = "cover";
  video.style.zIndex = "-1";

  document.body.appendChild(video);
})
.catch(err => {
  alert("カメラ許可が必要です");
});
</script>

</body>
</html>
