<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>No051 — AR Viewer</title>
<link rel="apple-touch-icon" href="No051_512.png">
<link rel="icon" type="image/png" href="No051_512.png">
<script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  overflow: hidden;
  background: #000;
  font-family: 'Share Tech Mono', monospace;
}

/* A-Frame canvas fills screen */
a-scene {
  position: fixed;
  inset: 0;
  width: 100% !important;
  height: 100% !important;
}

/* ─── HUD corners ─── */
.hud-corner {
  position: fixed;
  width: 44px;
  height: 44px;
  border-color: rgba(0,229,255,0.3);
  border-style: solid;
  z-index: 100;
  pointer-events: none;
}
.hud-corner.tl { top:16px; left:16px;   border-width: 2px 0 0 2px; }
.hud-corner.tr { top:16px; right:16px;  border-width: 2px 2px 0 0; }
.hud-corner.bl { bottom:16px; left:16px;  border-width: 0 0 2px 2px; }
.hud-corner.br { bottom:16px; right:16px; border-width: 0 2px 2px 0; }

/* ─── Scan instruction overlay ─── */
#scan-hint {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  z-index: 100;
  pointer-events: none;
  transition: opacity 0.6s ease;
}

.hint-frame {
  position: relative;
  width: 180px;
  height: 180px;
  border: 1px solid rgba(0,229,255,0.25);
  animation: framePulse 2s ease-in-out infinite;
}
@keyframes framePulse {
  0%,100% { border-color: rgba(0,229,255,0.25); box-shadow: none; }
  50%     { border-color: rgba(0,229,255,0.6);  box-shadow: 0 0 20px rgba(0,229,255,0.15); }
}

/* Corner marks on hint frame */
.hint-frame::before,
.hint-frame::after {
  content: '';
  position: absolute;
  width: 20px;
  height: 20px;
  border-color: rgba(0,229,255,0.7);
  border-style: solid;
}
.hint-frame::before { top:-1px; left:-1px; border-width: 2px 0 0 2px; }
.hint-frame::after  { bottom:-1px; right:-1px; border-width: 0 2px 2px 0; }

/* Extra corners via child elements */
.hint-frame .c-tr { position:absolute; top:-1px; right:-1px; width:20px; height:20px; border:2px solid rgba(0,229,255,0.7); border-left:none; border-bottom:none; }
.hint-frame .c-bl { position:absolute; bottom:-1px; left:-1px; width:20px; height:20px; border:2px solid rgba(0,229,255,0.7); border-right:none; border-top:none; }

/* Scan line inside frame */
.hint-scan {
  position: absolute;
  left: 0; width: 100%; height: 1px;
  background: linear-gradient(to right, transparent, rgba(0,229,255,0.7), transparent);
  animation: scanMove 2s linear infinite;
}
@keyframes scanMove {
  0%   { top: 0%; opacity:0; }
  8%   { opacity: 1; }
  92%  { opacity: 1; }
  100% { top: 100%; opacity:0; }
}

.hint-text {
  color: rgba(0,229,255,0.55);
  font-size: 0.62em;
  letter-spacing: 0.25em;
  text-align: center;
  animation: textBlink 2s ease-in-out infinite;
}
@keyframes textBlink {
  0%,100% { opacity: 0.55; }
  50%     { opacity: 0.2; }
}

/* ─── Status bar ─── */
#status-bar {
  position: fixed;
  bottom: 18px;
  left: 0; right: 0;
  text-align: center;
  font-size: 0.5em;
  letter-spacing: 0.25em;
  color: rgba(0,229,255,0.25);
  z-index: 100;
  pointer-events: none;
}
</style>
</head>
<body>

<!-- ─── HUD ─── -->
<div class="hud-corner tl"></div>
<div class="hud-corner tr"></div>
<div class="hud-corner bl"></div>
<div class="hud-corner br"></div>

<!-- ─── Scan instruction (disappears when marker found) ─── -->
<div id="scan-hint">
  <div class="hint-frame">
    <div class="c-tr"></div>
    <div class="c-bl"></div>
    <div class="hint-scan"></div>
  </div>
  <div class="hint-text">MARKER を探しています</div>
</div>

<div id="status-bar">AR SCANNING — MINIMUM REQUIREMENTS</div>

<!-- ─── A-Frame AR Scene ─── -->
<a-scene
  vr-mode-ui="enabled: false"
  renderer="logarithmicDepthBuffer: true; precision: medium;"
  embedded
  arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
>

  <!-- ── HIRO マーカー検知 ── -->
  <a-marker
    preset="hiro"
    id="hiro-marker"
    smooth="true"
    smoothCount="5"
    smoothTolerance="0.01"
    smoothThreshold="5"
    raycaster="objects: .clickable"
    emitevents="true"
    cursor="fuse: false; rayOrigin: mouse;"
  >

    <!-- ── ホログラム本体 (マーカーの上に浮かぶ) ── -->
    <a-entity
      id="holo-root"
      position="0 0.6 0"
      animation__float="property: position;
                         from: 0 0.6 0;
                         to:   0 0.75 0;
                         dir: alternate;
                         dur: 2500;
                         loop: true;
                         easing: easeInOutSine"
    >

      <!-- パネル背景 -->
      <a-plane
        width="2.4" height="1.1"
        color="#001828"
        opacity="0.8"
        position="0 0 0"
      ></a-plane>

      <!-- 上ボーダーライン -->
      <a-plane
        width="2.4" height="0.012"
        color="#00e5ff" opacity="0.7"
        position="0 0.544 0.003"
      ></a-plane>
      <!-- 下ボーダーライン -->
      <a-plane
        width="2.4" height="0.012"
        color="#00e5ff" opacity="0.7"
        position="0 -0.544 0.003"
      ></a-plane>
      <!-- 左ボーダーライン -->
      <a-plane
        width="0.012" height="1.1"
        color="#00e5ff" opacity="0.3"
        position="-1.194 0 0.003"
      ></a-plane>
      <!-- 右ボーダーライン -->
      <a-plane
        width="0.012" height="1.1"
        color="#00e5ff" opacity="0.3"
        position="1.194 0 0.003"
      ></a-plane>

      <!-- ヘッダーテキスト -->
      <a-text
        value="MSG.RECV"
        align="center"
        color="#00e5ff"
        opacity="0.4"
        width="1.6"
        position="0 0.38 0.005"
        font="monoid"
      ></a-text>

      <!-- メッセージ グローレイヤー（背後の発光） -->
      <a-text
        id="msg-glow"
        value="..."
        align="center"
        color="#00e5ff"
        opacity="0.18"
        width="2.6"
        wrap-count="16"
        position="0 -0.02 0.004"
        scale="1.06 1.06 1"
        font="monoid"
      ></a-text>

      <!-- メッセージ メインテキスト -->
      <a-text
        id="msg-main"
        value="..."
        align="center"
        color="#00e5ff"
        opacity="0.95"
        width="2.4"
        wrap-count="16"
        position="0 -0.02 0.008"
        font="monoid"
        animation__pulse="property: opacity;
                           from: 0.95; to: 0.65;
                           dir: alternate;
                           dur: 3000;
                           loop: true;
                           easing: easeInOutSine"
      ></a-text>

      <!-- フッター装飾バー -->
      <a-plane
        width="0.5" height="0.008"
        color="#00e5ff" opacity="0.5"
        position="-0.4 -0.38 0.005"
        animation="property: opacity; from:0.5; to:1; dir:alternate; dur:1800; loop:true"
      ></a-plane>
      <a-plane
        width="0.25" height="0.008"
        color="#00e5ff" opacity="0.5"
        position="0.2 -0.38 0.005"
        animation="property: opacity; from:0.5; to:1; dir:alternate; dur:1800; loop:true; delay:400"
      ></a-plane>
      <a-plane
        width="0.7" height="0.008"
        color="#00e5ff" opacity="0.5"
        position="0.05 -0.38 0.005"
        animation="property: opacity; from:0.5; to:1; dir:alternate; dur:1800; loop:true; delay:800"
      ></a-plane>

    </a-entity>
  </a-marker>

  <!-- カメラ -->
  <a-entity camera></a-entity>

</a-scene>

<script>
/* ── メッセージをURLパラメータから取得 ── */
const params  = new URLSearchParams(location.search);
const message = params.get("text") || "NO MESSAGE";

/* ── A-Frameシーン読み込み後にテキストをセット ── */
const scene = document.querySelector("a-scene");

function setMessage() {
  document.getElementById("msg-main").setAttribute("value", message);
  document.getElementById("msg-glow").setAttribute("value", message);
}

if (scene.hasLoaded) {
  setMessage();
} else {
  scene.addEventListener("loaded", setMessage);
}

/* ── マーカー検知でヒントを非表示 ── */
const marker    = document.getElementById("hiro-marker");
const scanHint  = document.getElementById("scan-hint");
const statusBar = document.getElementById("status-bar");

marker.addEventListener("markerFound", () => {
  scanHint.style.opacity  = "0";
  statusBar.textContent   = "HOLOGRAM PROJECTION ACTIVE";
});
marker.addEventListener("markerLost", () => {
  scanHint.style.opacity  = "1";
  statusBar.textContent   = "AR SCANNING — MINIMUM REQUIREMENTS";
});
</script>
</body>
</html>
