<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>No051 — AR Viewer</title>
<link rel="apple-touch-icon" href="No051_512.png">
<link rel="icon" type="image/png" href="No051_512.png">
<script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body { overflow: hidden; background: #000; }

a-scene {
  position: fixed;
  inset: 0;
  width: 100% !important;
  height: 100% !important;
}

/* HUD corners */
.hud-corner {
  position: fixed;
  width: 44px; height: 44px;
  border-color: rgba(0,229,255,0.3);
  border-style: solid;
  z-index: 100;
  pointer-events: none;
}
.hud-corner.tl { top:16px; left:16px;   border-width: 2px 0 0 2px; }
.hud-corner.tr { top:16px; right:16px;  border-width: 2px 2px 0 0; }
.hud-corner.bl { bottom:16px; left:16px;  border-width: 0 0 2px 2px; }
.hud-corner.br { bottom:16px; right:16px; border-width: 0 2px 2px 0; }

/* Scan hint */
#scan-hint {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  z-index: 100;
  pointer-events: none;
  transition: opacity 0.6s ease;
  font-family: monospace;
}
.hint-frame {
  position: relative;
  width: 180px; height: 180px;
  border: 1px solid rgba(0,229,255,0.25);
  animation: framePulse 2s ease-in-out infinite;
}
@keyframes framePulse {
  0%,100% { border-color: rgba(0,229,255,0.25); }
  50%     { border-color: rgba(0,229,255,0.6); box-shadow: 0 0 20px rgba(0,229,255,0.15); }
}
.hint-frame::before { content:''; position:absolute; top:-1px; left:-1px; width:20px; height:20px; border:2px solid rgba(0,229,255,0.7); border-right:none; border-bottom:none; }
.hint-frame::after  { content:''; position:absolute; bottom:-1px; right:-1px; width:20px; height:20px; border:2px solid rgba(0,229,255,0.7); border-left:none; border-top:none; }
.hint-frame .c-tr { position:absolute; top:-1px; right:-1px; width:20px; height:20px; border:2px solid rgba(0,229,255,0.7); border-left:none; border-bottom:none; }
.hint-frame .c-bl { position:absolute; bottom:-1px; left:-1px; width:20px; height:20px; border:2px solid rgba(0,229,255,0.7); border-right:none; border-top:none; }
.hint-scan {
  position: absolute;
  left:0; width:100%; height:1px;
  background: linear-gradient(to right, transparent, rgba(0,229,255,0.7), transparent);
  animation: scanMove 2s linear infinite;
}
@keyframes scanMove {
  0%   { top:0%;   opacity:0; }
  8%   { opacity:1; }
  92%  { opacity:1; }
  100% { top:100%; opacity:0; }
}
.hint-text {
  color: rgba(0,229,255,0.55);
  font-size: 0.62em;
  letter-spacing: 0.25em;
  text-align: center;
  animation: textBlink 2s ease-in-out infinite;
}
@keyframes textBlink {
  0%,100% { opacity:0.55; }
  50%     { opacity:0.2; }
}

#status-bar {
  position: fixed;
  bottom: 18px; left:0; right:0;
  text-align: center;
  font-size: 0.5em;
  letter-spacing: 0.25em;
  color: rgba(0,229,255,0.25);
  z-index: 100;
  pointer-events: none;
  font-family: monospace;
}
</style>
</head>
<body>

<div class="hud-corner tl"></div>
<div class="hud-corner tr"></div>
<div class="hud-corner bl"></div>
<div class="hud-corner br"></div>

<div id="scan-hint">
  <div class="hint-frame">
    <div class="c-tr"></div>
    <div class="c-bl"></div>
    <div class="hint-scan"></div>
  </div>
  <div class="hint-text">MARKER を探しています</div>
</div>

<div id="status-bar">No.051 — MINIMUM REQUIREMENTS</div>

<!-- ─── A-Frame AR Scene ─── -->
<a-scene
  vr-mode-ui="enabled: false"
  renderer="logarithmicDepthBuffer: true; precision: medium;"
  embedded
  arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
>

  <a-marker
    preset="hiro"
    id="hiro-marker"
    smooth="true"
    smoothCount="5"
    smoothTolerance="0.01"
    smoothThreshold="5"
    emitevents="true"
  >
    <!-- ホログラム全体 -->
    <a-entity
      id="holo-root"
      position="0 1.0 0"
      animation__float="property: position;
                         from: 0 1.0 0;
                         to:   0 1.2 0;
                         dir: alternate;
                         dur: 2500;
                         loop: true;
                         easing: easeInOutSine"
    >

      <!-- パネル背景 -->
      <a-plane
        width="3.8" height="1.8"
        color="#001828"
        opacity="0.82"
        position="0 0 0"
      ></a-plane>

      <!-- 上ボーダー -->
      <a-plane width="3.8" height="0.02" color="#00e5ff" opacity="0.8"
        position="0 0.89 0.005"></a-plane>
      <!-- 下ボーダー -->
      <a-plane width="3.8" height="0.02" color="#00e5ff" opacity="0.8"
        position="0 -0.89 0.005"></a-plane>
      <!-- 左ボーダー -->
      <a-plane width="0.02" height="1.8" color="#00e5ff" opacity="0.35"
        position="-1.89 0 0.005"></a-plane>
      <!-- 右ボーダー -->
      <a-plane width="0.02" height="1.8" color="#00e5ff" opacity="0.35"
        position="1.89 0 0.005"></a-plane>

      <!-- ヘッダーラベル -->
      <a-text
        value="MSG.RECV"
        align="center"
        color="#00e5ff"
        opacity="0.35"
        width="3.0"
        position="0 0.62 0.01"
      ></a-text>

      <!-- メッセージ（発光レイヤー） -->
      <a-text
        id="msg-glow"
        value="..."
        align="center"
        color="#00e5ff"
        opacity="0.2"
        width="4.2"
        wrap-count="14"
        position="0 -0.05 0.008"
        scale="1.06 1.06 1"
      ></a-text>

      <!-- メッセージ（メイン） -->
      <a-text
        id="msg-main"
        value="..."
        align="center"
        color="#00e5ff"
        opacity="0.95"
        width="3.8"
        wrap-count="14"
        position="0 -0.05 0.015"
        animation__pulse="property: opacity;
                           from: 0.95; to: 0.6;
                           dir: alternate;
                           dur: 3000;
                           loop: true;
                           easing: easeInOutSine"
      ></a-text>

      <!-- フッター装飾バー -->
      <a-plane width="0.9" height="0.015" color="#00e5ff" opacity="0.5"
        position="-0.6 -0.62 0.005"
        animation="property: opacity; from:0.5; to:1; dir:alternate; dur:1800; loop:true">
      </a-plane>
      <a-plane width="0.45" height="0.015" color="#00e5ff" opacity="0.5"
        position="0.45 -0.62 0.005"
        animation="property: opacity; from:0.5; to:1; dir:alternate; dur:1800; loop:true; delay:400">
      </a-plane>
      <a-plane width="1.1" height="0.015" color="#00e5ff" opacity="0.5"
        position="0.1 -0.62 0.005"
        animation="property: opacity; from:0.5; to:1; dir:alternate; dur:1800; loop:true; delay:800">
      </a-plane>

    </a-entity>
  </a-marker>

  <a-entity camera></a-entity>

</a-scene>

<script>
const params  = new URLSearchParams(location.search);
const message = params.get("text") || "NO MESSAGE";

const scene = document.querySelector("a-scene");

function setMessage() {
  document.getElementById("msg-main").setAttribute("value", message);
  document.getElementById("msg-glow").setAttribute("value", message);
}

if (scene.hasLoaded) {
  setMessage();
} else {
  scene.addEventListener("loaded", setMessage);
}

const marker    = document.getElementById("hiro-marker");
const scanHint  = document.getElementById("scan-hint");
const statusBar = document.getElementById("status-bar");

marker.addEventListener("markerFound", () => {
  scanHint.style.opacity = "0";
  statusBar.textContent  = "HOLOGRAM PROJECTION ACTIVE";
});
marker.addEventListener("markerLost", () => {
  scanHint.style.opacity = "1";
  statusBar.textContent  = "AR SCANNING — MINIMUM REQUIREMENTS";
});
</script>
</body>
</html>
