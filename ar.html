<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>No051 — AR Viewer</title>
<link rel="apple-touch-icon" href="No051_512.png">
<link rel="icon" type="image/png" href="No051_512.png">
<script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #000; }

.hud-corner {
  position: fixed;
  width: 44px; height: 44px;
  border-color: rgba(0,229,255,0.3);
  border-style: solid;
  z-index: 100;
  pointer-events: none;
}
.hud-corner.tl { top:16px; left:16px;   border-width: 2px 0 0 2px; }
.hud-corner.tr { top:16px; right:16px;  border-width: 2px 2px 0 0; }
.hud-corner.bl { bottom:16px; left:16px;  border-width: 0 0 2px 2px; }
.hud-corner.br { bottom:16px; right:16px; border-width: 0 2px 2px 0; }

#scan-hint {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  z-index: 100;
  pointer-events: none;
  transition: opacity 0.6s ease;
  font-family: monospace;
}
.hint-frame {
  position: relative;
  width: 180px; height: 180px;
  border: 1px solid rgba(0,229,255,0.25);
  animation: framePulse 2s ease-in-out infinite;
}
@keyframes framePulse {
  0%,100% { border-color: rgba(0,229,255,0.25); }
  50%     { border-color: rgba(0,229,255,0.6); box-shadow: 0 0 20px rgba(0,229,255,0.15); }
}
.hint-frame::before { content:''; position:absolute; top:-1px; left:-1px; width:20px; height:20px; border:2px solid rgba(0,229,255,0.7); border-right:none; border-bottom:none; }
.hint-frame::after  { content:''; position:absolute; bottom:-1px; right:-1px; width:20px; height:20px; border:2px solid rgba(0,229,255,0.7); border-left:none; border-top:none; }
.hint-frame .c-tr { position:absolute; top:-1px; right:-1px; width:20px; height:20px; border:2px solid rgba(0,229,255,0.7); border-left:none; border-bottom:none; }
.hint-frame .c-bl { position:absolute; bottom:-1px; left:-1px; width:20px; height:20px; border:2px solid rgba(0,229,255,0.7); border-right:none; border-top:none; }
.hint-scan {
  position: absolute;
  left: 0; width: 100%; height: 1px;
  background: linear-gradient(to right, transparent, rgba(0,229,255,0.7), transparent);
  animation: scanMove 2s linear infinite;
}
@keyframes scanMove {
  0%   { top:0%;   opacity:0; }
  8%   { opacity:1; }
  92%  { opacity:1; }
  100% { top:100%; opacity:0; }
}
.hint-text {
  color: rgba(0,229,255,0.55);
  font-size: 0.62em;
  letter-spacing: 0.25em;
  text-align: center;
  animation: textBlink 2s ease-in-out infinite;
}
@keyframes textBlink {
  0%,100% { opacity:0.55; }
  50%     { opacity:0.2; }
}
#status-bar {
  position: fixed;
  bottom: 18px; left: 0; right: 0;
  text-align: center;
  font-size: 0.5em;
  letter-spacing: 0.25em;
  color: rgba(0,229,255,0.25);
  z-index: 100;
  pointer-events: none;
  font-family: monospace;
}
</style>
</head>
<body>

<div class="hud-corner tl"></div>
<div class="hud-corner tr"></div>
<div class="hud-corner bl"></div>
<div class="hud-corner br"></div>

<div id="scan-hint">
  <div class="hint-frame">
    <div class="c-tr"></div>
    <div class="c-bl"></div>
    <div class="hint-scan"></div>
  </div>
  <div class="hint-text">MARKER を探しています</div>
</div>

<div id="status-bar">AR SCANNING — MINIMUM REQUIREMENTS</div>

<a-scene
  vr-mode-ui="enabled: false"
  renderer="logarithmicDepthBuffer: true; precision: medium;"
  embedded
  arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
>
  <a-marker
    preset="hiro"
    id="hiro-marker"
    emitevents="true"
  >
    <!--
      rotation="-90 0 0" でパネルをカメラ方向（真上）に向ける。
      マーカーはテーブルなど平面に置かれ、カメラは上から見下ろすため
      -90度回転でパネル面がカメラを向く。
    -->
    <a-entity
      id="holo-root"
      position="0 0.01 0"
      rotation="-90 0 0"
      animation__float="property: position;
                         from: 0 0.01 0;
                         to:   0 0.08 0;
                         dir: alternate;
                         dur: 2500;
                         loop: true;
                         easing: easeInOutSine"
    >
      <!-- パネル背景 -->
      <a-plane
        id="holo-panel"
        width="2.5" height="1.2"
        color="#001828"
        opacity="0.85"
      ></a-plane>

      <!-- 上ボーダー -->
      <a-plane width="2.5" height="0.015" color="#00e5ff" opacity="0.85"
        position="0 0.593 0.002"></a-plane>
      <!-- 下ボーダー -->
      <a-plane width="2.5" height="0.015" color="#00e5ff" opacity="0.85"
        position="0 -0.593 0.002"></a-plane>
      <!-- 左ボーダー -->
      <a-plane width="0.015" height="1.2" color="#00e5ff" opacity="0.3"
        position="-1.243 0 0.002"></a-plane>
      <!-- 右ボーダー -->
      <a-plane width="0.015" height="1.2" color="#00e5ff" opacity="0.3"
        position="1.243 0 0.002"></a-plane>

      <!-- フッター装飾バー -->
      <a-plane width="0.7" height="0.012" color="#00e5ff" opacity="0.5"
        position="-0.5 -0.45 0.002"
        animation="property: opacity; from:0.5; to:1; dir:alternate; dur:1800; loop:true">
      </a-plane>
      <a-plane width="0.35" height="0.012" color="#00e5ff" opacity="0.5"
        position="0.35 -0.45 0.002"
        animation="property: opacity; from:0.5; to:1; dir:alternate; dur:1800; loop:true; delay:500">
      </a-plane>

    </a-entity>
  </a-marker>

  <a-entity camera></a-entity>
</a-scene>

<script>
var scene  = document.querySelector("a-scene");
var marker = document.getElementById("hiro-marker");

scene.addEventListener("loaded", function() {
  // URLパラメータを取得
  var msg = new URLSearchParams(location.search).get("text") || "NO MESSAGE";
  var root = document.getElementById("holo-root");

  // ── ヘッダーラベル（動的生成）
  var header = document.createElement("a-text");
  header.setAttribute("value",   "MSG.RECV");
  header.setAttribute("align",   "center");
  header.setAttribute("color",   "#00e5ff");
  header.setAttribute("opacity", "0.35");
  header.setAttribute("width",   "2.2");
  header.setAttribute("position","0 0.38 0.004");
  root.appendChild(header);

  // ── メッセージ 発光レイヤー（動的生成）
  var glow = document.createElement("a-text");
  glow.setAttribute("value",      msg);
  glow.setAttribute("align",      "center");
  glow.setAttribute("color",      "#00e5ff");
  glow.setAttribute("opacity",    "0.18");
  glow.setAttribute("width",      "2.8");
  glow.setAttribute("wrap-count", "14");
  glow.setAttribute("position",   "0 -0.02 0.005");
  glow.setAttribute("scale",      "1.06 1.06 1");
  root.appendChild(glow);

  // ── メッセージ メイン（動的生成）
  var main = document.createElement("a-text");
  main.setAttribute("value",      msg);
  main.setAttribute("align",      "center");
  main.setAttribute("color",      "#00e5ff");
  main.setAttribute("opacity",    "0.95");
  main.setAttribute("width",      "2.5");
  main.setAttribute("wrap-count", "14");
  main.setAttribute("position",   "0 -0.02 0.008");
  main.setAttribute("animation__pulse",
    "property: opacity; from: 0.95; to: 0.6; dir: alternate; dur: 3000; loop: true; easing: easeInOutSine"
  );
  root.appendChild(main);
});

// マーカーイベント
var scanHint  = document.getElementById("scan-hint");
var statusBar = document.getElementById("status-bar");

marker.addEventListener("markerFound", function() {
  scanHint.style.opacity = "0";
  statusBar.textContent  = "HOLOGRAM PROJECTION ACTIVE";
});
marker.addEventListener("markerLost", function() {
  scanHint.style.opacity = "1";
  statusBar.textContent  = "AR SCANNING — MINIMUM REQUIREMENTS";
});
</script>
</body>
</html>
