<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>AR Message Generator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
body {
  background: #0a0f1c;
  color: #00ffff;
  font-family: monospace;
  text-align: center;
  padding-top: 50px;
}
input {
  width: 70%;
  padding: 10px;
  background: black;
  border: 1px solid #00ffff;
  color: #00ffff;
}
button {
  margin-top: 20px;
  padding: 10px 20px;
  background: transparent;
  border: 1px solid #00ffff;
  color: #00ffff;
}
#qrcode {
  margin-top: 30px;
}
</style>
</head>

<body>

<h1>AR MESSAGE</h1>

<input id="text" placeholder="伝えたい言葉を入力">

<br>
<button onclick="generate()">GENERATE</button>

<div id="qrcode"></div>

<script>
function generate() {
  const text = document.getElementById("text").value;

  // ★ GitHub Pages完全対応URL
  const base = location.origin + location.pathname.replace("index.html", "");
  const url = base + "ar.html?text=" + encodeURIComponent(text);

  document.getElementById("qrcode").innerHTML = "";

  new QRCode(document.getElementById("qrcode"), {
    text: url,
    width: 220,
    height: 220
  });
}
</script>

</body>
</html>
