<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>No051</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@300;400;600&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --cyan: #00e5ff;
  --cyan-dim: rgba(0,229,255,0.35);
  --cyan-glow: rgba(0,229,255,0.12);
  --bg: #04080f;
  --panel-bg: rgba(0,18,35,0.6);
}

body {
  background: var(--bg);
  color: var(--cyan);
  font-family: 'Share Tech Mono', monospace;
  min-height: 100dvh;
  overflow: hidden;
}

/* ─── SHARED ─── */
.corner { position: absolute; width: 14px; height: 14px; border-color: var(--cyan); border-style: solid; }
.corner.tl { top:0; left:0;  border-width: 2px 0 0 2px; }
.corner.tr { top:0; right:0; border-width: 2px 2px 0 0; }
.corner.bl { bottom:0; left:0;  border-width: 0 0 2px 2px; }
.corner.br { bottom:0; right:0; border-width: 0 2px 2px 0; }

/* ─────────────────────────────────────────
   GENERATOR MODE
───────────────────────────────────────── */
#generator {
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100dvh;
  padding: 28px 20px;
  background: radial-gradient(ellipse 80% 60% at 50% 40%, rgba(0,80,120,0.18) 0%, transparent 70%);
  position: relative;
}

/* Subtle animated grid */
#generator::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(0,229,255,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,229,255,0.04) 1px, transparent 1px);
  background-size: 36px 36px;
  animation: gridDrift 12s linear infinite;
  pointer-events: none;
}
@keyframes gridDrift {
  from { background-position: 0 0; }
  to   { background-position: 0 36px; }
}

.no-mark {
  position: relative;
  display: inline-block;
}
.no-sup {
  position: absolute;
  top: 0.04em;
  left: 50%;
  transform: translateX(-50%);
  font-size: 0.38em;
  line-height: 1;
  font-family: inherit;
  font-weight: 600;
}

.gen-title {
  font-family: 'Rajdhani', sans-serif;
  font-size: clamp(1.8em, 6vw, 2.6em);
  font-weight: 600;
  letter-spacing: 0.45em;
  text-shadow: 0 0 24px var(--cyan), 0 0 60px rgba(0,229,255,0.3);
  animation: titleBreath 4s ease-in-out infinite;
  margin-bottom: 6px;
  position: relative;
  z-index: 1;
}
.no-mark {
  position: relative;
  display: inline-block;
  letter-spacing: 0;
  margin-right: 0.1em;
}
.no-sup {
  position: absolute;
  top: 0;
  left: 100%;
  font-size: 0.42em;
  line-height: 1;
  letter-spacing: 0;
  font-weight: 400;
}
@keyframes titleBreath {
  0%,100% { opacity:1; }
  50% { opacity: 0.75; }
}

.gen-sub {
  font-size: 0.6em;
  letter-spacing: 0.3em;
  color: rgba(0,229,255,0.4);
  margin-bottom: 44px;
  position: relative;
  z-index: 1;
}

/* Input group */
.input-group {
  width: 100%;
  max-width: 420px;
  position: relative;
  margin-bottom: 22px;
  z-index: 1;
}

.input-group .corner { border-color: var(--cyan-dim); }

.msg-input {
  width: 100%;
  padding: 15px 20px;
  background: var(--panel-bg);
  border: 1px solid var(--cyan-dim);
  color: var(--cyan);
  font-family: 'Share Tech Mono', monospace;
  font-size: 1em;
  outline: none;
  text-align: center;
  letter-spacing: 0.08em;
  transition: border-color 0.25s, box-shadow 0.25s;
  -webkit-appearance: none;
}
.msg-input::placeholder { color: rgba(0,229,255,0.22); }
.msg-input:focus {
  border-color: var(--cyan);
  box-shadow: 0 0 28px rgba(0,229,255,0.18), inset 0 0 16px rgba(0,229,255,0.04);
}

/* Generate button */
.gen-btn {
  position: relative;
  padding: 13px 48px;
  background: transparent;
  border: 1px solid var(--cyan-dim);
  color: var(--cyan);
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.85em;
  letter-spacing: 0.35em;
  cursor: pointer;
  overflow: hidden;
  transition: border-color 0.25s, box-shadow 0.25s;
  z-index: 1;
  text-transform: uppercase;
}
.gen-btn::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent 0%, rgba(0,229,255,0.08) 50%, transparent 100%);
  transform: translateX(-100%);
  transition: transform 0.4s;
}
.gen-btn:hover { border-color: var(--cyan); box-shadow: 0 0 28px rgba(0,229,255,0.22); }
.gen-btn:hover::before { transform: translateX(100%); }
.gen-btn:active { opacity: 0.7; }

/* QR display area */
#qr-area {
  display: none;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  margin-top: 32px;
  position: relative;
  z-index: 1;
  animation: fadeUp 0.4s ease both;
}
@keyframes fadeUp {
  from { opacity:0; transform: translateY(12px); }
  to   { opacity:1; transform: translateY(0); }
}

.qr-wrap {
  position: relative;
  padding: 14px;
  background: #fff;
  box-shadow: 0 0 40px rgba(0,229,255,0.25), 0 0 80px rgba(0,229,255,0.1);
}
.qr-wrap .corner { border-color: var(--cyan); border-width: 3px; width: 18px; height: 18px; }

.qr-label {
  font-size: 0.65em;
  letter-spacing: 0.22em;
  color: rgba(0,229,255,0.45);
  text-align: center;
}
.qr-hint {
  font-size: 0.55em;
  letter-spacing: 0.15em;
  color: rgba(0,229,255,0.22);
  text-align: center;
}

/* ─────────────────────────────────────────
   VIEWER MODE
───────────────────────────────────────── */
#viewer {
  display: none;
  position: fixed;
  inset: 0;
}

/* Camera / fallback bg */
#cam-video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: 0;
}
#fallback-bg {
  display: none;
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at 50% 45%, #05141e 0%, #020508 100%);
  z-index: 0;
}
#fallback-grid {
  display: none;
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(0,229,255,0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,229,255,0.05) 1px, transparent 1px);
  background-size: 42px 42px;
  animation: gridDrift 10s linear infinite;
  z-index: 1;
  pointer-events: none;
}

/* HUD corners (full screen) */
.hud-corner {
  position: absolute;
  width: 44px;
  height: 44px;
  border-color: rgba(0,229,255,0.28);
  border-style: solid;
  z-index: 20;
}
.hud-corner.tl { top:16px; left:16px; border-width: 2px 0 0 2px; }
.hud-corner.tr { top:16px; right:16px; border-width: 2px 2px 0 0; }
.hud-corner.bl { bottom:16px; left:16px; border-width: 0 0 2px 2px; }
.hud-corner.br { bottom:16px; right:16px; border-width: 0 2px 2px 0; }

/* Center overlay */
.viewer-center {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 10;
  pointer-events: none;
}

/* ─── Hologram panel ─── */
.holo-panel {
  position: relative;
  width: min(88vw, 400px);
  padding: 0;
  overflow: visible;
  animation: holoFloat 3.2s ease-in-out infinite;
}

@keyframes holoFloat {
  0%,100% { transform: translateY(0); }
  50%      { transform: translateY(-11px); }
}

/* Main panel body */
.holo-body {
  position: relative;
  background: var(--panel-bg);
  border: 1px solid rgba(0,229,255,0.5);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  overflow: hidden;
  padding: 24px 22px 20px;
}

/* Scan line */
.scan-line {
  position: absolute;
  left: 0; width: 100%; height: 1px;
  background: linear-gradient(to right, transparent 0%, rgba(0,229,255,0.6) 50%, transparent 100%);
  animation: scanMove 2.2s linear infinite;
  z-index: 3;
  pointer-events: none;
}
@keyframes scanMove {
  0%   { top: 0%;   opacity: 0; }
  8%   { opacity: 1; }
  92%  { opacity: 1; }
  100% { top: 100%; opacity: 0; }
}

/* Inner grid */
.holo-body::after {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(0,229,255,0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,229,255,0.025) 1px, transparent 1px);
  background-size: 18px 18px;
  pointer-events: none;
  z-index: 1;
}

/* Header row */
.holo-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 0.52em;
  letter-spacing: 0.28em;
  color: rgba(0,229,255,0.45);
  margin-bottom: 18px;
  position: relative;
  z-index: 4;
}
.holo-dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--cyan);
  box-shadow: 0 0 6px var(--cyan);
  animation: dotBlink 1.4s ease-in-out infinite;
}
@keyframes dotBlink { 0%,100% { opacity:1; } 50% { opacity:0.15; } }

/* Message text */
.holo-msg {
  font-family: 'Rajdhani', sans-serif;
  font-weight: 400;
  font-size: clamp(1.3em, 5.5vw, 2em);
  color: var(--cyan);
  text-align: center;
  line-height: 1.45;
  word-break: break-word;
  text-shadow:
    0 0  8px rgba(0,229,255,0.9),
    0 0 22px rgba(0,229,255,0.5),
    0 0 55px rgba(0,200,255,0.25);
  position: relative;
  z-index: 4;
  letter-spacing: 0.04em;
  animation: msgFlicker 9s ease-in-out infinite;
}
@keyframes msgFlicker {
  0%,100% { opacity:1; }
  91%     { opacity:1; }
  92%     { opacity:0.55; }
  93%     { opacity:1; }
  95%     { opacity:0.8; }
  96%     { opacity:1; }
}

/* Footer bars */
.holo-foot {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin-top: 18px;
  position: relative;
  z-index: 4;
}
.h-bar {
  height: 2px;
  background: rgba(0,229,255,0.38);
  animation: barPulse 2.2s ease-in-out infinite;
}
.h-bar:nth-child(1) { width: 44px; }
.h-bar:nth-child(2) { width: 22px; animation-delay: 0.35s; }
.h-bar:nth-child(3) { width: 60px; animation-delay: 0.7s; }
@keyframes barPulse {
  0%,100% { opacity:0.38; }
  50%     { opacity:1; box-shadow: 0 0 6px var(--cyan); }
}

/* Glitch effect on panel */
.holo-body {
  animation: panelGlitch 7s ease-in-out infinite;
}
@keyframes panelGlitch {
  0%,88%,100% { clip-path: none; }
  89% { clip-path: inset(8% 0 84% 0);  transform: translate(-3px); }
  90% { clip-path: inset(45% 0 42% 0); transform: translate(3px); }
  91% { clip-path: none; transform: none; }
}

/* Vertical accent lines on sides of panel */
.holo-panel::before,
.holo-panel::after {
  content: '';
  position: absolute;
  top: 10%; height: 80%;
  width: 1px;
  background: linear-gradient(to bottom, transparent, rgba(0,229,255,0.4), transparent);
  z-index: 0;
}
.holo-panel::before { left: -10px; }
.holo-panel::after  { right: -10px; }

/* Status bar bottom */
.status-bar {
  position: absolute;
  bottom: 18px;
  left: 0; right: 0;
  text-align: center;
  font-size: 0.52em;
  letter-spacing: 0.22em;
  color: rgba(0,229,255,0.28);
  z-index: 20;
}

/* ─── Appear animation on load ─── */
.viewer-center {
  animation: sceneAppear 0.8s ease both;
}
@keyframes sceneAppear {
  from { opacity:0; transform: scale(0.94); }
  to   { opacity:1; transform: scale(1); }
}
</style>
</head>
<body>

<!-- ══════════ GENERATOR MODE ══════════ -->
<div id="generator">
  <div class="gen-title"><span style="position:relative;display:inline-block">N<span style="position:absolute;font-size:0.42em;top:0.08em;left:150%;line-height:1;letter-spacing:0">o</span></span><span style="margin-left:0.55em">051</span></div>
  <div class="gen-sub">// minimum requirements //</div>

  <div class="input-group">
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>
    <input
      type="text"
      class="msg-input"
      id="msg-input"
      placeholder="伝えたいことを入力..."
      maxlength="80"
      autocomplete="off"
    >
  </div>

  <button class="gen-btn" onclick="generateQR()">ENCRYPT</button>

  <div id="qr-area">
    <div class="qr-wrap">
      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>
      <div id="qr-canvas"></div>
    </div>
    <div class="qr-label">相手のスマホでスキャンしてください</div>
    <div class="qr-hint">SCAN → HOLOGRAM PROJECTION</div>
  </div>
</div>

<!-- ══════════ VIEWER MODE ══════════ -->
<div id="viewer">
  <video id="cam-video" autoplay playsinline muted></video>
  <div id="fallback-bg"></div>
  <div id="fallback-grid"></div>

  <div class="hud-corner tl"></div>
  <div class="hud-corner tr"></div>
  <div class="hud-corner bl"></div>
  <div class="hud-corner br"></div>

  <div class="viewer-center">
    <div class="holo-panel">
      <div class="holo-body">
        <div class="scan-line"></div>
        <div class="holo-head">
          <span>MSG.RECV</span>
          <div class="holo-dot"></div>
          <span id="time-display">--:--</span>
        </div>
        <div class="holo-msg" id="holo-message">…</div>
        <div class="holo-foot">
          <div class="h-bar"></div>
          <div class="h-bar"></div>
          <div class="h-bar"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="status-bar">HOLOGRAM PROJECTION ACTIVE</div>
</div>

<script>
/* ── MODE DETECTION ──────────────────────── */
const params  = new URLSearchParams(location.search);
const message = params.get("text");

if (message) {
  startViewer(message);
} else {
  document.getElementById("generator").style.display = "flex";
  document.getElementById("msg-input").addEventListener("keypress", e => {
    if (e.key === "Enter") generateQR();
  });
}

/* ── GENERATOR ───────────────────────────── */
function generateQR() {
  const text = document.getElementById("msg-input").value.trim();
  if (!text) return;

  // Same page + ?text= (works on any host, including GitHub Pages)
  const base = location.href.split("?")[0];
  const url  = base + "?text=" + encodeURIComponent(text);

  const qrArea = document.getElementById("qr-area");
  const canvas = document.getElementById("qr-canvas");
  canvas.innerHTML = "";
  qrArea.style.display = "flex";

  new QRCode(canvas, {
    text: url,
    width: 200,
    height: 200,
    colorDark:  "#000000",
    colorLight: "#ffffff"
  });
}

/* ── VIEWER ──────────────────────────────── */
function startViewer(msg) {
  document.getElementById("generator").style.display = "none";
  document.getElementById("viewer").style.display    = "block";
  document.getElementById("holo-message").textContent = msg;

  updateTime();
  setInterval(updateTime, 1000);

  // Request rear camera on mobile
  navigator.mediaDevices.getUserMedia({
    video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 } },
    audio: false
  })
  .then(stream => {
    document.getElementById("cam-video").srcObject = stream;
  })
  .catch(() => {
    // No camera: show dark grid fallback
    document.getElementById("cam-video").style.display    = "none";
    document.getElementById("fallback-bg").style.display  = "block";
    document.getElementById("fallback-grid").style.display = "block";
  });
}

function updateTime() {
  const now = new Date();
  const hh  = String(now.getHours()).padStart(2, "0");
  const mm  = String(now.getMinutes()).padStart(2, "0");
  document.getElementById("time-display").textContent = hh + ":" + mm;
}
</script>
</body>
</html>
