<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>No051</title>
<link rel="apple-touch-icon" href="No051_512.png">
<link rel="icon" type="image/png" href="No051_512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="No051">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@300;400;600&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --cyan: #00e5ff;
  --cyan-dim: rgba(0,229,255,0.35);
  --bg: #04080f;
  --panel-bg: rgba(0,18,35,0.6);
}

body {
  background: var(--bg);
  color: var(--cyan);
  font-family: 'Share Tech Mono', monospace;
  min-height: 100dvh;
  overflow-x: hidden;
  overflow-y: auto;
}

.corner { position: absolute; width: 14px; height: 14px; border-color: var(--cyan); border-style: solid; }
.corner.tl { top:0; left:0;  border-width: 2px 0 0 2px; }
.corner.tr { top:0; right:0; border-width: 2px 2px 0 0; }
.corner.bl { bottom:0; left:0;  border-width: 0 0 2px 2px; }
.corner.br { bottom:0; right:0; border-width: 0 2px 2px 0; }

#generator {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100dvh;
  padding: 40px 20px 60px;
  background: radial-gradient(ellipse 80% 60% at 50% 40%, rgba(0,80,120,0.18) 0%, transparent 70%);
  position: relative;
}
#generator::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(0,229,255,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,229,255,0.04) 1px, transparent 1px);
  background-size: 36px 36px;
  animation: gridDrift 12s linear infinite;
  pointer-events: none;
  z-index: 0;
}
@keyframes gridDrift {
  from { background-position: 0 0; }
  to   { background-position: 0 36px; }
}

.gen-title {
  font-family: 'Rajdhani', sans-serif;
  font-size: clamp(1.8em, 6vw, 2.6em);
  font-weight: 600;
  letter-spacing: 0.45em;
  text-shadow: 0 0 24px var(--cyan), 0 0 60px rgba(0,229,255,0.3);
  animation: titleBreath 4s ease-in-out infinite;
  margin-bottom: 6px;
  position: relative;
  z-index: 1;
}
@keyframes titleBreath {
  0%,100% { opacity:1; }
  50% { opacity:0.75; }
}
.gen-sub {
  font-size: 0.6em;
  letter-spacing: 0.3em;
  color: rgba(0,229,255,0.4);
  margin-bottom: 44px;
  position: relative;
  z-index: 1;
}

.input-group {
  width: 100%;
  max-width: 420px;
  position: relative;
  margin-bottom: 22px;
  z-index: 1;
}
.input-group .corner { border-color: var(--cyan-dim); }
.msg-input {
  width: 100%;
  padding: 15px 20px;
  background: var(--panel-bg);
  border: 1px solid var(--cyan-dim);
  color: var(--cyan);
  font-family: 'Share Tech Mono', monospace;
  font-size: 1em;
  outline: none;
  text-align: center;
  letter-spacing: 0.08em;
  transition: border-color 0.25s, box-shadow 0.25s;
  -webkit-appearance: none;
}
.msg-input::placeholder { color: rgba(0,229,255,0.22); }
.msg-input:focus {
  border-color: var(--cyan);
  box-shadow: 0 0 28px rgba(0,229,255,0.18), inset 0 0 16px rgba(0,229,255,0.04);
}

.gen-btn {
  position: relative;
  padding: 13px 48px;
  background: transparent;
  border: 1px solid var(--cyan-dim);
  color: var(--cyan);
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.85em;
  letter-spacing: 0.35em;
  cursor: pointer;
  overflow: hidden;
  transition: border-color 0.25s, box-shadow 0.25s;
  z-index: 1;
  text-transform: uppercase;
}
.gen-btn::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent, rgba(0,229,255,0.08), transparent);
  transform: translateX(-100%);
  transition: transform 0.4s;
}
.gen-btn:hover { border-color: var(--cyan); box-shadow: 0 0 28px rgba(0,229,255,0.22); }
.gen-btn:hover::before { transform: translateX(100%); }
.gen-btn:active { opacity: 0.7; }

/* ─── QR + Marker area ─── */
#qr-area {
  display: none;
  flex-direction: column;
  align-items: center;
  gap: 28px;
  margin-top: 36px;
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 420px;
  animation: fadeUp 0.4s ease both;
}
@keyframes fadeUp {
  from { opacity:0; transform: translateY(12px); }
  to   { opacity:1; transform: translateY(0); }
}

.step-block {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  width: 100%;
}
.step-num {
  font-size: 0.52em;
  letter-spacing: 0.35em;
  color: rgba(0,229,255,0.35);
}
.step-label {
  font-size: 0.58em;
  letter-spacing: 0.2em;
  color: rgba(0,229,255,0.5);
  text-align: center;
}
.step-hint {
  font-size: 0.48em;
  letter-spacing: 0.12em;
  color: rgba(0,229,255,0.22);
  text-align: center;
  line-height: 1.7;
}

.qr-wrap {
  position: relative;
  padding: 14px;
  background: #fff;
  box-shadow: 0 0 40px rgba(0,229,255,0.25), 0 0 80px rgba(0,229,255,0.1);
}
.qr-wrap .corner  { border-color: var(--cyan); border-width: 3px; width: 18px; height: 18px; }

.step-divider {
  width: 1px;
  height: 28px;
  background: linear-gradient(to bottom, transparent, rgba(0,229,255,0.3), transparent);
}

.marker-wrap {
  position: relative;
  padding: 10px;
  background: #fff;
  box-shadow: 0 0 30px rgba(0,229,255,0.2);
}
.marker-wrap .corner { border-color: var(--cyan); border-width: 3px; width: 18px; height: 18px; }
.marker-wrap img {
  display: block;
  width: 160px;
  height: 160px;
  image-rendering: pixelated;
}
</style>
</head>
<body>

<div id="generator">
  <div class="gen-title">
    <span style="position:relative;display:inline-block">N<span style="position:absolute;font-size:0.42em;top:0.3em;left:70%;line-height:1;letter-spacing:0">o</span></span><span style="margin-left:0.25em">051</span>
  </div>
  <div class="gen-sub">// minimum requirements //</div>

  <div class="input-group">
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>
    <input
      type="text"
      class="msg-input"
      id="msg-input"
      placeholder="伝えたいことを入力..."
      maxlength="80"
      autocomplete="off"
    >
  </div>

  <button class="gen-btn" onclick="generateQR()">ENCRYPT</button>

  <div id="qr-area">

    <div class="step-block">
      <div class="step-num">— STEP 01 —</div>
      <div class="step-label">相手にスキャンしてもらう</div>
      <div class="qr-wrap">
        <div class="corner tl"></div>
        <div class="corner tr"></div>
        <div class="corner bl"></div>
        <div class="corner br"></div>
        <div id="qr-canvas"></div>
      </div>
    </div>

    <div class="step-divider"></div>

    <div class="step-block">
      <div class="step-num">— STEP 02 —</div>
      <div class="step-label">このマーカーにかざしてもらう</div>
      <div class="marker-wrap">
        <div class="corner tl"></div>
        <div class="corner tr"></div>
        <div class="corner bl"></div>
        <div class="corner br"></div>
        <img
          src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/data/images/hiro.png"
          alt="AR Marker"
        >
      </div>
      <div class="step-hint">
        MINIMUM REQUIREMENTS<br>
        近づかないと見えない
      </div>
    </div>

  </div>
</div>

<script>
document.getElementById("msg-input").addEventListener("keypress", e => {
  if (e.key === "Enter") generateQR();
});

function generateQR() {
  const text = document.getElementById("msg-input").value.trim();
  if (!text) return;

  document.getElementById("msg-input").value = "";

  // ar.html（同ディレクトリ）へのURLを生成
  const base = new URL("ar.html", location.href).href;
  const url  = base + "?text=" + encodeURIComponent(text);

  const qrArea = document.getElementById("qr-area");
  const canvas = document.getElementById("qr-canvas");
  canvas.innerHTML = "";
  qrArea.style.display = "flex";

  document.querySelector(".input-group").style.display = "none";
  document.querySelector(".gen-btn").style.display     = "none";

  new QRCode(canvas, {
    text: url,
    width: 200,
    height: 200,
    colorDark:  "#000000",
    colorLight: "#ffffff"
  });
}
</script>
</body>
</html>
